name: CI

# Runs the same gates as the `/check` skill (format + the pytest suite) on every
# push to main and every pull request. The repo had no CI before this; treat a
# green check here as the automated stand-in for the manual pre-PR check.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # lets you trigger a run by hand from the Actions tab

# If you push again to the same branch/PR while a run is in flight, cancel the
# old run instead of queueing a second one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: format (black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # `uvx` runs black ephemerally — pinned to the version the team runs locally
      # so CI and your machine agree on formatting. Bump this line when you upgrade
      # black (keep it in sync with the [dev] extra in pyproject.toml). No
      # [jupyter] extra, so notebooks are skipped — same as `black --check .`.
      - run: uvx black@26.5.1 --check .

  test:
    name: test (py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # run every Python version even if one of them fails
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Sync from the committed uv.lock so CI installs exactly the locked versions,
      # but against each matrix interpreter (the universal lockfile covers the whole
      # requires-python >=3.11 range). The suites are fully offline (the mock LLM
      # provider drives the ReAct loop), so engine + dev tools are all we need — no
      # API keys and no openai/anthropic install.
      # --extra server pulls FastAPI/uvicorn so tests/test_api.py (the headless
      # backend API, #179) is exercised rather than skipped via importorskip.
      - run: uv sync --extra dev --extra server --locked --python ${{ matrix.python-version }}
      # The turn-based NPC behavior suite now lives at tests/test_npc_behaviors.py
      # (moved in #51), so pytest collects it — no separate run step needed.
      - name: pytest suite
        run: uv run --no-sync pytest tests/ -q
      # The godot-generative-agents backend keeps its own offline suite under
      # godot-generative-agents/tests/ (it sits beside the `backend` package it
      # exercises, moved out of generative-agents/tests/). It's a separate pytest
      # root (not collected by the tests/ run above) so it needs its own step; it
      # imports the sim as the installed top-level `backend` package and the Penn
      # `serve_penn`/`penn_world` scripts off backend/penn/. Fully offline (mock
      # brain + the tracked the_upenn matrix) — no ./setup.sh and no external clone,
      # same offline contract as the engine suite above.
      - name: pytest godot-generative-agents suite
        run: uv run --no-sync pytest godot-generative-agents/tests/ -q
