<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tomb — iPhone Animations</title>
<!-- GENERATED by app/build_iphone_reel.py. The phone-legible reel: every KEY-m
     twin from figures.js, rendered at a phone column width. Parallel to
     /animations/ (the desktop reel). Source of truth for the cards themselves
     is app/prototypes/retro-animations.html. -->
<style>
  :root{
    --void:#010304; --ph:#4db8ff; --dim:#24587c; --bright:#dff2ff;
    --fungus:#ff9a3c; --ink:#0a1620; --hair:#123246;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; background:var(--void);}
  body{
    color:var(--ph);
    font-family:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,monospace;
    font-size:15px; line-height:1.5;
    text-shadow:0 0 6px rgba(77,184,255,.18);
    -webkit-text-size-adjust:100%;
  }
  .reel{max-width:440px; margin:0 auto; padding:26px 16px 90px;}
  header{margin-bottom:24px;}
  .kicker{color:var(--dim); letter-spacing:.24em; text-transform:uppercase;
    font-size:11px; margin:0 0 6px;}
  h1{color:var(--bright); font-size:20px; font-weight:600; letter-spacing:.12em;
    text-transform:uppercase; margin:0 0 8px; text-wrap:balance;}
  .lede{color:var(--ph); font-size:13px; margin:0;}
  .lede code{color:var(--bright); background:rgba(77,184,255,.08);
    padding:1px 5px; border-radius:3px;}
  .count{color:var(--fungus); font-variant-numeric:tabular-nums;}
  .divider{height:1px; background:linear-gradient(90deg,var(--dim),transparent);
    margin:20px 0;}

  .card{margin:0 0 34px;}
  .card h2{color:var(--bright); font-size:14px; font-weight:600;
    letter-spacing:.06em; margin:0 0 2px; text-wrap:balance;}
  .card .key{color:var(--dim); font-size:11px; letter-spacing:.14em;
    text-transform:uppercase; margin:0 0 9px;}
  /* the terminal's own card frame + CRT dressing, phone width */
  .figure{position:relative; background:var(--void); overflow:hidden;
    border:1px solid var(--dim); border-radius:6px;
    box-shadow:inset 0 0 60px rgba(0,0,0,.9), 0 0 24px rgba(77,184,255,.07);
    min-height:60px;}
  .figure svg,.figure canvas{display:block; width:100%; height:auto;}
  .figure::after{content:""; position:absolute; inset:0; pointer-events:none;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%);}

  footer{color:var(--dim); font-size:12px; border-top:1px solid var(--hair);
    padding-top:16px; margin-top:20px;}
  .empty{color:var(--dim); padding:40px 0;}
</style>
</head>
<body>
<div class="reel">
  <header>
    <p class="kicker">Tomb of Nassak an-Rah</p>
    <h1>iPhone Animations</h1>
    <p class="lede">The phone-legible twins &mdash; each card re-composed with big
      type for a phone column, the parallel to the desktop
      <a href="../animations/" style="color:var(--ph)">/animations/</a> reel.
      <span class="count" id="count"></span></p>
  </header>
  <div class="divider"></div>
  <div id="cards"></div>
  <footer>Not yet wired into the live game. Cards land here a few at a time as
    their twins are drawn.</footer>
</div>

<script>/*__FIGURES_JS__*/</script>
<script>
  (function(){
    var CARDS = /*__CARDS__*/;
    var F = window.TombFigures;
    // a sample run, in case a twin ever reads the death ledger
    F.context = { score:85, max:100, hints:2, cause:"the Cacklemaw's ambush" };
    // a few animate around the viewport; the rest freeze on their tableau
    F.MAX_LIVE = 6;
    var host = document.getElementById("cards");
    document.getElementById("count").textContent =
      CARDS.length + (CARDS.length === 1 ? " card" : " cards");
    if (!CARDS.length){
      host.innerHTML = '<p class="empty">No phone twins yet.</p>';
      return;
    }
    // render lazily: a card animates when it scrolls into view, and re-animates
    // each time it re-enters (figures.js keeps only MAX_LIVE live at once).
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if (!e.isIntersecting) return;
        var box = e.target;
        box.innerHTML = "";
        try { F.render(box.getAttribute("data-key"), box); }
        catch (err) { box.textContent = "(render error: " + err.message + ")"; }
      });
    }, { threshold: 0.2 });
    CARDS.forEach(function(pair){
      var key = pair[0], title = pair[1] || key;
      var sec = document.createElement("section"); sec.className = "card";
      var h = document.createElement("h2"); h.textContent = title;
      var k = document.createElement("p"); k.className = "key"; k.textContent = key;
      var box = document.createElement("div"); box.className = "figure";
      box.setAttribute("data-key", key);
      sec.appendChild(h); sec.appendChild(k); sec.appendChild(box);
      host.appendChild(sec);
      io.observe(box);
    });
  })();
</script>
</body>
</html>
