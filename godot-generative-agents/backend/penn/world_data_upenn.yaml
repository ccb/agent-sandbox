# A small University of Pennsylvania cast for the generative-agents sim, walking
# the REAL campus. The map is derived from OpenStreetMap by
# godot-generative-agents/tools/geo/osm_to_ville.py (the_upenn matrix). Each building now has a walkable
# interior reached through a single door (godot-generative-agents/tools/geo/add_entrances.py), so each
# location's `address` is the building's "UPenn:<building>:lobby" INTERIOR address
# -- "study in Van Pelt Library" walks the agent in through the door rather than
# stopping at the edge. (The matrix still has "UPenn:<building>:grounds" for the
# outside, and the pathfinder can only cross the wall ring at the door.) Every
# `start_tile` is a walkable doorstep tile just outside its building. The mock
# brain drives each persona through its schedule, so this runs offline,
# deterministically, and free -- the same as the_ville cast.
#
# Buildings used (all real, all inside the 34th-36th x Spruce-Walnut block):
#   College Hall, Van Pelt Library, Houston Hall, Williams Hall, Meyerson Hall,
#   Irvine Auditorium. This block is Penn's academic core (College Green) and has
#   no residence in frame, so each persona starts on the campus walks (`home: Penn
#   campus`, the outdoor hub) at a `start_tile` just outside their first building --
#   so even the first stop is a walk *into* the building through its door, not an
#   activity performed on the doorstep. (The mock brain travels whenever its current
#   location differs from the stop's place; starting at the hub makes stop 1 a real
#   trip inside.)
#
# Van Pelt Library is furnished into 25 navigable rooms (godot-generative-agents/tools/geo/furnish_van_pelt.py
# + add_entrances.py, #268), each its own arena address "UPenn:Van Pelt Library:<room>".
# So instead of stopping in the lobby, the cast below sends its Van Pelt stops to
# specific rooms: a location like "Van Pelt — Moelis Reading Room" carries the address
# "UPenn:Van Pelt Library:Moelis Family Grand Reading Room", and the pathfinder routes
# the agent in through the door and between rooms through the interior doorways. Maya
# walks a real in-library circuit (circulation desk -> reading room in the morning, the
# book stacks -> study booths at night), so the replay shows room-to-room movement
# inside the building rather than an agent frozen at the threshold.
#
# Heads-up when adding rooms: a place name must not contain a bare compass word
# ("north"/"east"/...), because the parser reads "travel to <place>" as a movement
# command and would treat e.g. "West Wing" as "go west". (That is why the west-wing
# stacks are named "Book Stacks" here, not "West Wing Stacks".)

personas:
# -- MVP cast reduction: 4 of the 7 personas are parked while the live-LLM MVP
#    runs on a 3-agent cast (Diego, Tanaka, Sofia). Re-enable by uncommenting. --
# - name: Maya Chen
#   home: Penn campus
#   persona: I am Maya Chen, 19, a sophomore at Penn studying biology. I am curious,
#     diligent, and a little caffeine-dependent. I spend most of my day studying in
#     Van Pelt Library between classes.
#   emoji: 📚
#   start_tile:
#   - 164
#   - 57
#   schedule:
#   # Maya starts on the walk right outside Van Pelt's east door, so her day opens
#   # with a walk straight into the library and a circuit through its rooms.
#   - place: Van Pelt — Circulation Desk
#     activity: checking out a reserved organic chemistry textbook
#     emoji: 📚
#     steps: 15
#   - place: Van Pelt — Moelis Reading Room
#     activity: studying for an organic chemistry exam
#     emoji: 📚
#     # A long morning in the reading room: Priya Nair shares it with her, so this
#     # window has to outlast their conversation (see the `meetings` block below).
#     steps: 70
#   - place: Houston Hall
#     activity: grabbing a coffee at the student union
#     emoji: ☕
#     steps: 60
#   - place: College Hall
#     activity: heading to an afternoon seminar
#     emoji: 🎓
#     steps: 50
#   - place: Van Pelt — Book Stacks
#     activity: pulling a few references off the shelves
#     emoji: 📖
#     steps: 20
#   - place: Van Pelt — Study Booths
#     activity: reviewing her notes before tomorrow
#     emoji: 📖
# - name: Professor Ellis
#   home: Penn campus
#   persona: I am Professor Ellis, 52. I teach history at Penn and keep an office in
#     College Hall. I am thoughtful, a bit formal, and devoted to my students.
#   emoji: 🧑‍🏫
#   start_tile:
#   - 40
#   - 265
#   schedule:
#   - place: Houston Hall
#     activity: meeting a student over coffee
#     emoji: ☕
#     # Ellis lingers at the student union through the morning; Marcus Webb joins him
#     # for coffee here (see the `meetings` block), so this window stays long.
#     steps: 150
#   - place: Williams Hall
#     activity: giving a midday lecture
#     emoji: 🗣️
#     steps: 25
#   - place: Van Pelt — Microtext Collection
#     activity: scanning microfilm of primary sources
#     emoji: 📜
#     steps: 20
#   - place: Van Pelt — Book Stacks
#     activity: pulling sources for a paper
#     emoji: 📜
#     steps: 30
#   - place: College Hall
#     activity: holding office hours
#     emoji: 🧑‍🏫
- name: Diego Torres
  home: Penn campus
  persona: I am Diego Torres, 24, a graduate student in architecture at Penn. I am
    creative, focused, and always sketching. I spend long hours in the Meyerson
    Hall studio.
  emoji: ✏️
  start_tile:
  - 194
  - 48
  schedule:
  - place: Meyerson Hall
    activity: working on a studio model
    emoji: ✏️
    steps: 65
  - place: Van Pelt — Kamin Gallery
    activity: studying precedents in the gallery exhibits
    emoji: 🏛️
    # Sofia Ramirez wanders in while Diego is here (see `meetings`), so give the
    # gallery stop a long window for their exchange.
    steps: 70
  - place: Van Pelt — Digital Scholarship Exchange
    activity: researching precedents for a project
    emoji: 🏛️
    steps: 25
  - place: Irvine Auditorium
    activity: attending a guest lecture
    emoji: 🎤
    steps: 50
  - place: Meyerson Hall
    # Wording matters: the parser's intent matcher is substring-based, and the
    # earlier "...late into the day" matched `"ate " in command` -> the EAT
    # action -> blocked ("I don't know what you want to eat") every turn, so
    # Diego froze at this stop. Keep activities clear of verb substrings
    # ("ate ", "eat ", "get ", "take ", "drink", ...) until the parser gives
    # `perform` precedence.
    activity: refining the model into the evening
    emoji: ✏️
# -- MVP cast reduction (continued): Priya Nair + Marcus Webb parked. --
# - name: Priya Nair
#   home: Penn campus
#   persona: I am Priya Nair, 20, a junior studying computer science at Penn. I am
#     sharp, social, and always somewhere between a problem set and a coffee. Maya and
#     I have been study buddies since freshman bio.
#   emoji: 💻
#   # Starts on the walk beside Van Pelt's east door, next to Maya, so the two of them
#   # head into the reading room together.
#   start_tile:
#   - 163
#   - 57
#   schedule:
#   - place: Van Pelt — Moelis Reading Room
#     activity: working through a problem set with Maya
#     emoji: 💻
#     # Priya gets to the reading room first and settles in for a long morning;
#     # Maya arrives later (after the circulation desk), so this stays long enough
#     # that the two overlap through their whole conversation.
#     steps: 200
#   - place: Houston Hall
#     activity: grabbing lunch between classes
#     emoji: 🥪
#     steps: 50
#   - place: Van Pelt — Digital Scholarship Exchange
#     activity: pulling a dataset for a course project
#     emoji: 💻
#     steps: 40
#   - place: College Hall
#     activity: heading to an afternoon lecture
#     emoji: 🎓
# - name: Marcus Webb
#   home: Penn campus
#   persona: I am Marcus Webb, 20, a sophomore and part-time campus tour guide. I am
#     chatty, upbeat, and I know every shortcut on Locust Walk. I'm taking Professor
#     Ellis's history seminar this term.
#   emoji: 🎒
#   # Starts just outside Houston Hall, where he grabs coffee before a morning tour --
#   # the same student union where Ellis is holding court.
#   start_tile:
#   - 120
#   - 223
#   schedule:
#   - place: Houston Hall
#     activity: grabbing coffee before a campus tour
#     emoji: ☕
#     # Marcus gets here first; he lingers long enough that Ellis (a longer walk from
#     # the southwest) arrives and they share the student union through their whole
#     # coffee chat (see `meetings`).
#     steps: 220
#   - place: College Hall
#     activity: leading a tour group past the green
#     emoji: 🎒
#     steps: 45
#   - place: Van Pelt — Microtext Collection
#     activity: digging up an old campus map for the tour
#     emoji: 🗺️
- name: Professor Tanaka
  home: Penn campus
  persona: I am Professor Tanaka, 47, a physicist at Penn. I am precise and warm with
    students, and happiest explaining the universe with a marker in hand.
  emoji: 🔬
  # Starts outside Irvine, where she is hosting an afternoon guest lecture, and stays
  # long enough that Diego and Sofia arrive while she is still setting up.
  start_tile:
  - 180
  - 212
  schedule:
  - place: Irvine Auditorium
    activity: setting up for an afternoon guest lecture
    emoji: 🔬
    # Holds the hall all afternoon -- long enough that Sofia (who only drifts over
    # after a long spell in the gallery) arrives while she is still there (see
    # `meetings`).
    steps: 800
  - place: Williams Hall — Classroom A
    activity: holding a problem session for her physics class
    emoji: 🧮
    furniture: blackboard
- name: Sofia Ramirez
  home: Penn campus
  persona: I am Sofia Ramirez, 18, a first-year still finding my way around Penn. I
    am wide-eyed, friendly, and curious about everything on campus.
  emoji: 🗺️
  # Starts in the north of campus near Meyerson, then drifts into Van Pelt's gallery
  # and on to the guest lecture at Irvine.
  start_tile:
  - 191
  - 63
  schedule:
  - place: Van Pelt — Kamin Gallery
    activity: wandering the gallery exhibits
    emoji: 🖼️
    # Lingers in the gallery long enough that Diego (who arrives much later, after
    # his Meyerson studio session and the cross-campus walk) overlaps with her here
    # through their whole exchange (see `meetings`).
    steps: 220
  - place: Irvine Auditorium
    activity: sitting in on a guest lecture
    emoji: 🎤
    steps: 60
  # The boil-water arc (#300), watchable end-to-end, as three same-place Houston
  # Hall stops. The mock brain issues one authored command per step and then
  # `perform`s the stop's activity for the rest of its `steps:`, so splitting the
  # arc across stops spaces the sickness / boiled / recovery events ~20 steps
  # apart on the timeline -- WITHOUT filler `wait` commands (each of which logged
  # a 1.0 "I did wait" memory and a GameEvent onto this showcase card). Same-place
  # stops advance fine: the planner's positional carry-over handles distinct
  # activities at one place -- there is no same-place merge to work around.
  # Activities stay free of action verbs so the terminal `perform` can't re-parse
  # one as a command (#535). Boiling is the engine crafting Recipe (#300): `make
  # boiled water` consumes the murky pot and PRODUCES a `pot of boiled water`, so
  # she drinks the murky pot raw (sickness) and the boiled pot after (recovery).
  # (The arc still sits late in Sofia's long day; a fully de-clumped short demo is
  # the dedicated boil replay, #592.)
  - place: Houston Hall
    activity: settling in for dinner at the union
    steps: 20
    commands:
    - get pot of murky water
    - drink pot of murky water   # -> sickness (raw water)
  - place: Houston Hall
    activity: feeling queasy at the table
    steps: 20
    commands:
    - make boiled water          # -> boiled (consumes murky pot, produces boiled pot)
  - place: Houston Hall
    activity: feeling much better at last
    commands:
    - drink pot of boiled water  # -> recovery (the produced boiled pot)

locations:
- name: Penn campus
  description: The streets and walks of Penn's campus, tying every corner together.
  address: null
  hub: true
- name: College Hall
  description: Penn's oldest building and administrative heart, on College Green.
  address: UPenn:College Hall:lobby
- name: Van Pelt Library
  description: The main university library, where students study at all hours.
  address: UPenn:Van Pelt Library:lobby
# Named rooms inside Van Pelt (each a furnished, navigable arena from #268). Targeting
# these instead of the lobby walks an agent through the door and between rooms.
- name: Van Pelt — Circulation Desk
  description: The circulation and reserve desk just inside Van Pelt's doors.
  address: UPenn:Van Pelt Library:Circulation
- name: Van Pelt — Moelis Reading Room
  description: The Moelis Family Grand Reading Room, Van Pelt's flagship study hall.
  address: UPenn:Van Pelt Library:Moelis Family Grand Reading Room
  properties: [studyable]
- name: Van Pelt — Book Stacks
  description: The west-wing book stacks, rows of open shelving.
  address: UPenn:Van Pelt Library:West Wing Books
- name: Van Pelt — Study Booths
  description: Quiet individual study booths in the west wing.
  address: UPenn:Van Pelt Library:Study Booths
  properties: [studyable]
- name: Van Pelt — Microtext Collection
  description: The microfilm and microfiche archive of historical print.
  address: UPenn:Van Pelt Library:Microtext Collection
- name: Van Pelt — Kamin Gallery
  description: The Kamin Gallery, Van Pelt's exhibition space.
  address: UPenn:Van Pelt Library:Kamin Gallery
- name: Van Pelt — Digital Scholarship Exchange
  description: The Research Data and Digital Scholarship Exchange, for data and digital work.
  address: UPenn:Van Pelt Library:Research Data and Digital Scholarship Exchange
- name: Houston Hall
  description: The student union -- the nation's first -- with dining and lounges.
  address: UPenn:Houston Hall:lobby
  properties: [dining]
# Named rooms inside Houston Hall (furnished arenas, same pattern as the Van Pelt
# rooms above). Schedule stops can target these to put an agent in a specific
# room instead of wherever the whole-building lobby routing settles. Two
# constraints keep this list curated rather than exhaustive:
# * Every location entry consumes a slot in the decide tool's location enum
#   (DECIDE_MAX_ENUM = 20, pinned by test_per_action_decide) -- the other six
#   Houston arenas (Bathroom, Shuffle Board Room, Ladies Parlor, Secretarys
#   Office, Chess Room, Correspond) exist in the map and can be promoted here
#   as needed while slots remain.
# * The #465 boil-water props (cups/sink/stove/pot) live in the building-level
#   "Houston Hall" location, so a stop that runs the murky-water commands must
#   keep targeting "Houston Hall" itself.
- name: Houston Hall — Reception Hall
  description: The reception hall just inside Houston Hall's doors.
  address: UPenn:Houston Hall:Reception Hall
- name: Houston Hall — Billiard Room
  description: The billiard room off the student union's main hall.
  address: UPenn:Houston Hall:Billiard Room
- name: Houston Hall — Reading Room
  description: Houston Hall's reading room, armchairs and newspapers.
  address: UPenn:Houston Hall:Reading Room
- name: Williams Hall
  description: A classroom and language-department building just off College Green.
  address: UPenn:Williams Hall:lobby
- name: Williams Hall — Classroom A
  description: A Williams Hall classroom with a blackboard, where problem sessions meet.
  address: UPenn:Williams Hall:Classroom A
- name: Meyerson Hall
  description: Home of the Weitzman School of Design, full of architecture studios.
  address: UPenn:Meyerson Hall:lobby
- name: Irvine Auditorium
  description: The landmark auditorium that hosts lectures and performances.
  address: UPenn:Irvine Auditorium:lobby

# ---------------------------------------------------------------------------
# Seed social graph: who knows whom at t=0 (read by backend/penn/penn_world.py,
# NOT by the engine's load_world_data). Emitted as `meta.relationships` for the
# viewer's social-graph pop-up (#252), which contrasts this seeded graph with
# the conversations that actually happen during the run. Structured -- unlike
# Smallville's whisper CSV (agent_history_init_n25.csv) -- so the viewer can
# draw edges directly; `description` stays natural language so a future pass
# (#409) can also seed it into agent memory the way seed.seed_relationships
# does for Smallville. `closeness` is 1 (acquaintance) to 5 (inseparable) and
# drives edge thickness. Every `a`/`b` must name an ACTIVE persona above --
# the loader fails the bake/server on unknown names, so parked personas' edges
# stay commented out with them. Sofia has no seed edge on purpose: she is a
# first-year who knows nobody at t=0 -- the pop-up's conversations view shows
# her graph forming over the day.
relationships:
# -- MVP cast reduction: edges among parked personas ride with their personas. --
# - a: Maya Chen
#   b: Priya Nair
#   kind: study buddies
#   closeness: 4
#   description: Maya and Priya have been study buddies since freshman bio and
#     meet most mornings in Van Pelt to grind through problem sets together.
# - a: Professor Ellis
#   b: Marcus Webb
#   kind: professor & student
#   closeness: 2
#   description: Marcus is taking Professor Ellis's history seminar this term
#     and looks for him over coffee at Houston Hall.
- a: Diego Torres
  b: Professor Tanaka
  kind: lecture regular
  closeness: 2
  description: Diego sits in on Professor Tanaka's public guest lectures at
    Irvine whenever architecture and physics cross paths; she knows him by
    name from the question line.

# ---------------------------------------------------------------------------
# Scripted meetings (read by backend/penn/generate_penn_replay.py, NOT by the engine's
# load_world_data). The mock brain never produces dialogue, so to show the
# viewer's speech-bubble + conversation-link feature offline we author a short
# exchange per meeting and the generator injects it into the replay's `chat`
# field -- but ONLY across the frames where the participants are actually within
# the perception radius of each other (proximity-honest: a bubble/link is never
# drawn between agents who aren't really standing together on the map). If a
# meeting's participants never co-locate long enough in a given bake, the
# generator skips it and logs a warning rather than faking a cross-map chat.
#
# Each `dialogue` line is [speaker, text]; the speaker must be a participant.
# Keep exchanges short: the viewer plays ~14 steps per line, and the whole
# exchange must fit inside the window the participants are actually together.
#
# `at` names the location (must match a `locations` name above) where the meeting
# happens. The generator routes the participants to a tight rendezvous cluster
# inside that place -- a few tiles apart, so they settle within perception range
# of each other (a short conversation link) rather than at opposite edges of a big
# room. The participants' schedules still have to put them there at the same time.
meetings:
# -- MVP cast reduction: meeting parked (Maya & Priya are commented out above). --
# - label: Maya & Priya cram for the orgo exam (Moelis Reading Room)
#   at: Van Pelt — Moelis Reading Room
#   participants: [Maya Chen, Priya Nair]
#   dialogue:
#   - [Maya Chen, "Priya! Did you get through the reaction mechanisms?"]
#   - [Priya Nair, "Barely -- chapter 12 nearly broke me. You?"]
#   - [Maya Chen, "Same. Want to quiz each other before the exam?"]
#   - [Priya Nair, "Yes. Then I owe us both a coffee at Houston."]
- label: Diego shows Sofia around the gallery (Kamin Gallery)
  at: Van Pelt — Kamin Gallery
  participants: [Diego Torres, Sofia Ramirez]
  dialogue:
  - [Sofia Ramirez, "Oh wow -- is this whole gallery student work?"]
  - [Diego Torres, "Some of it. I'm pulling precedents for my studio project."]
  - [Sofia Ramirez, "That's amazing. I had no idea the library had this."]
  - [Diego Torres, "Stick around -- the guest lecture at Irvine is worth it too."]
# -- MVP cast reduction: meeting parked (Ellis & Marcus are commented out above). --
# - label: Ellis and Marcus over coffee (Houston Hall)
#   at: Houston Hall
#   participants: [Professor Ellis, Marcus Webb]
#   dialogue:
#   - [Marcus Webb, "Morning, Professor! Mind if I take this seat?"]
#   - [Professor Ellis, "Of course, Marcus. How's the seminar treating you?"]
#   - [Marcus Webb, "Loving it -- though the reading is no joke."]
#   - [Professor Ellis, "It never is. My office hours are open if you need them."]
- label: Before the guest lecture at Irvine (Irvine Auditorium)
  at: Irvine Auditorium
  participants: [Professor Tanaka, Sofia Ramirez]
  dialogue:
  - [Professor Tanaka, "Find a seat anywhere -- we start in a few minutes."]
  - [Sofia Ramirez, "Thank you! I've never been inside Irvine before."]
  - [Professor Tanaka, "First time? Sit close -- the demos are the best part."]

# ---------------------------------------------------------------------------
# LLM configuration for the LIVE server (read by backend/penn/serve_penn.py ONLY, and
# only when launched with `--brain llm`; the engine's load_world_data never
# sees this block). The default run (`--brain mock`, or no flag) stays the
# deterministic, free mock brain no matter what is written here.
#
# provider must be "anthropic" -- the Penn runner accepts no other provider,
# and the API key comes from the ANTHROPIC_API_KEY environment variable alone
# (never LLM_API_KEY, never OPENAI_API_KEY).
llm:
  provider: anthropic
  # Claude Haiku powers EVERY model call the live MVP makes: the travel/perform
  # decisions, the conversation lines, and the reflection passes. (Daily
  # planning stays on the hand-authored schedules above -- see
  # serve_penn.resolve_llm for why.)
  model: claude-haiku-4-5
  # Hard cost ceiling (USD) for one server run: once cumulative spend reaches
  # it, the tick loop ends the day (the live loop pauses; the viewer HUD's
  # budget row shows TRIPPED). Resets do NOT clear spend.
  max_cost_usd: 5.0
