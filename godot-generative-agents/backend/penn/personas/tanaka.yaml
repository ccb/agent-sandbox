# Professor Tanaka -- physicist. Default-cast member (#731).
name: Professor Tanaka
home: Penn campus
persona: I am Professor Tanaka, 47, a physicist at Penn. I am precise and warm with
  students, and happiest explaining the universe with a marker in hand.
emoji: 🔬
# Wage (#931 follow-up): paid per tick actually spent on a work stop below.
wage_rate: 0.1
# Starts outside Irvine, where she is hosting a morning guest lecture, and stays
# long enough that Diego and Sofia arrive while she is still setting up.
start_tile:
- 180
- 212
schedule:
- place: Irvine Auditorium
  # The 10:00 start time lives here, not only in the world event (#795 post-run
  # review): attach_agents deliberately never seeds the public-event
  # announcement to its own host (her schedule already carries the
  # commitment), so without the time in her own authored activity string she
  # would never learn it while Diego and Sofia -- who DO get the announcement
  # -- do. This string mirrors into her t=0 plan memory (attach_agents), so a
  # real planner reads the same clock time on both sides of the lecture.
  activity: setting up for the 10:00 guest lecture on gravitational waves
  emoji: 🔬
  is_work: true
  # Holds the hall all morning -- long enough that Sofia (who only drifts over
  # after a long spell in the gallery) arrives while she is still there (see
  # `meetings` below).
  steps: 800
- place: Williams Hall — Classroom A
  activity: holding a problem session for her physics class
  emoji: 🧮
  furniture: blackboard
  is_work: true
  steps: 200
# Turns in for the night (#931 follow-up): see sofia.yaml's matching stop --
# Houston Hall -- Reading Room is the only `sleepable` spot in the world.
- place: Houston Hall — Reading Room
  activity: turning in for bed
  emoji: 😴
  commands:
  - sleep

meetings:
- label: Before the guest lecture at Irvine (Irvine Auditorium)
  at: Irvine Auditorium
  participants: [Professor Tanaka, Sofia Ramirez]
  dialogue:
  - [Professor Tanaka, "Find a seat anywhere -- we start in a few minutes."]
  - [Sofia Ramirez, "Thank you! I've never been inside Irvine before."]
  - [Professor Tanaka, "First time? Sit close -- the demos are the best part."]
