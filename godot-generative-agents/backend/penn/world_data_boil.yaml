# A one-persona boil-water DEMO world (#592), a de-clumped companion to the full
# campus cast in `world_data_upenn.yaml`. Its whole purpose is the boil-water arc
# (#300): a single resident, already inside Houston Hall, drinks the murky water
# and gets sick, boils a pot, then drinks the boiled water and recovers -- with the
# three events (sickness / boiled / recovery) spread across most of a short replay
# so a viewer sees them at a glance, instead of buried at ~step 945 of Sofia's long
# day in the bundled bake.
#
# Baked via `generate_penn_replay.py --scenario boil` (which loads THIS file, a
# short step budget, and writes maps/penn_replay_boil.json). It reuses the same
# `the_upenn` matrix and the shared `build_penn_world` factory, so the boil props
# (`_furnish_boil_water`: the murky pot + sink + stove) and the Penn verb set
# (get/drink/boil/...) are stocked into Houston Hall exactly as in the full world.
#
# Sofia's curated day and the bundled replay are untouched -- this is an additive,
# self-contained fixture (it also doubles as the scenario for the connect-the-dots
# LLM experiment, #595).

personas:
- name: Nadia Okafor
  # `home` is the location the persona wakes in (build_world places them there), so
  # it MUST be Houston Hall for the boil props to be in scope from step 0 -- no
  # cross-campus commute, so the arc starts early. `start_tile` is the lobby-centre
  # tile the sprite spawns on (verified walkable; Houston Hall lobby centroid).
  home: Houston Hall
  persona: I am Nadia Okafor, 22, a Penn grad student living out of the student
    union while my apartment's water is shut off. I am practical and a quick learner.
  emoji: 🚰
  start_tile:
  - 111
  - 248
  schedule:
  # The arc is split into four stops, all in Houston Hall (== home, so no travel:
  # it runs from step 0). Each stop issues its authored command(s), then *performs*
  # its activity for `steps` more -- and a perform block is quiet on the event log
  # (one marker for the whole window), unlike an explicit `wait` command (one marker
  # PER step). So the `steps` gaps space the three events ~29 steps apart on the
  # timeline WITHOUT flooding the scrubber with wait-markers. Net in the default
  # 90-step bake: sickness@~11 (12%), boiled@~40 (44%), recovery@~69 (76%) -- an
  # early, clearly separated arc that fills most of the timeline, and the arc's
  # three events are the only interesting markers on the strip (12 events total).
  #
  # (Splitting a stop by `place` alone would be dropped by the schedule round-trip,
  # but these differ by `activity` too, so `ScheduleMockClient.replace_schedule`
  # re-attaches each stop's `commands` positionally -- verified by the bake + test.)
  # NOTE: each `activity` must be verb-free prose. Between commands the mock issues
  # `perform <activity>`, which is re-parsed -- an activity containing an action verb
  # (drink/get/boil/...) or even the substring "ate" would be mis-read as that
  # command and spam parser failures (cf. #535, "Diego's 'late' -> EAT"). So the
  # activities below describe a *state* ("at the union", "feeling ill"), never a verb.
  # A short healthy lead-in so the before-state is visible before the first drink.
  - place: Houston Hall
    activity: settling in at the union before dinner
    emoji: 🚰
    steps: 10
  - place: Houston Hall
    activity: at the table before dinner
    emoji: 🚰
    steps: 28
    commands:
    - get pot of murky water
    - drink pot of murky water   # -> sickness (DrinkPenn: requires_boiling + unboiled)
  - place: Houston Hall
    activity: feeling ill at the table
    emoji: 🤒
    steps: 28
    commands:
    - make boiled water          # -> boiled (consumes murky pot, produces boiled pot)
  - place: Houston Hall
    activity: hoping the queasiness passes
    emoji: 🤒
    steps: 12
    commands:
    - drink pot of boiled water  # -> recovery (the produced boiled pot; 🤢 reverts)
  - place: Houston Hall
    activity: recovered and back at the union
    emoji: 🍽️
    # Last stop: steps null => stays put for the rest of the bake (the tail that
    # shows the recovered agent, 🤢 reverted, before the replay ends).
    steps: null

locations:
- name: Penn campus
  description: The streets and walks of Penn's campus, tying every corner together.
  address: null
  hub: true
- name: Houston Hall
  description: The student union -- the nation's first -- with dining and lounges.
  address: UPenn:Houston Hall:lobby
