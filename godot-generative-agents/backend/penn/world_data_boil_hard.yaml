# A harder connect-the-dots variant of `world_data_boil.yaml` (#595's
# "does a live LLM choose to boil?" scenario), for
# `experiments/boil_hard_connect_dots.py` and `serve_penn.py --scenario
# boil_hard`. Same one-persona arc, same `build_penn_world` factory, same boil
# Recipe -- the single difference is an extra `Kitchen` location.
# `penn_world.relocate_stove_to_kitchen` moves the stove (furnished into
# Houston Hall by `_furnish_boil_water`, same as the base world) out of
# Houston Hall and into this Kitchen at build time; callers run with
# `CognitionConfig(vision_r=0)` so the stove can never leak into the agent's
# Houston Hall observation via cross-location perception (#82) -- discovering
# it requires actually traveling to "Kitchen" first. The only lead is that
# "Kitchen" is always a named Travel destination (the decide tool's per-verb
# enum lists every `game.locations` entry, #635) -- there is no in-room hint
# beyond the name itself. The persona starts merely thirsty (no seeded
# aversion memory, unless the harness is told to seed one): the model has to
# reason "a kitchen might have what I need" from general knowledge, not from
# an in-game memory or a visible tool.
#
# `Kitchen`'s `address` is Sweeten Alumni Building's real "Room 1: Kitchen"
# arena -- an actual dorm-suite kitchenette already furnished (dining table,
# fruit basket, food) by `tools/geo/furnish_alumni.py`, so the room the agent
# arrives in visually reads as a kitchen. It has no stove of its own on the
# map today; `relocate_stove_to_kitchen` adds the boil Recipe's stove there as
# a logical game Item only (no new tile sprite / geo-pipeline edit) -- the
# room's real furniture is authentically a kitchen, the stove just isn't
# drawn on the tile yet.
#
# This file is NOT read by `generate_penn_replay.py`'s default bake --
# it's for `experiments/boil_hard_connect_dots.py` and the live
# `serve_penn.py --scenario boil_hard` path.

personas:
