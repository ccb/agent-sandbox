<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Title matches the page's own <h1>, so the browser tab, the search result
         and the shared-link card all say the same thing. -->
    <title>PennAgents: Generative Agents on a Campus Map</title>
    <link rel="icon" href="/upenn-shield.svg" />
    <!-- Public-launch metadata (#882): this is what a shared link looks like. The
         description is condensed from the page's own Abstract so the two can't
         drift. Deliberately no og:image: its poster frame was to come from the
         demo video, deferred with #881 (2026-08-03) — Slack/X render the text
         `summary` card rather than a broken image. -->
    <meta
      name="description"
      content="Five generative agents — LLM-driven characters with persistent memory, daily plans and conversations — live a simulated twelve-hour day on a tile map of Penn's campus built from real OpenStreetMap data. PURM 2026, University of Pennsylvania."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="PennAgents: Generative Agents on a Campus Map" />
    <meta
      property="og:description"
      content="Five LLM-driven agents with memory, plans and conversations walk a real map of Penn's campus for a simulated twelve-hour day — replayable in the browser."
    />
    <meta name="twitter:card" content="summary" />
    <!-- HOLD, not the final answer (#882). The site went live 2026-08-13 while the
         `index.pck` art-licensing question was still open, so indexing is switched
         off until that is settled — the packs in ASSETS.md permit use but not
         redistribution, and a search result is what turns a URL people are given
         into a URL people find.

         Deliberately NOT paired with a `Disallow` in robots.txt: a disallowed page
         is never fetched, so the crawler never sees this tag and an already-indexed
         URL can linger. Noindex requires crawling to work. `vercel.json` sends the
         same directive as `X-Robots-Tag` for the non-HTML assets a meta tag cannot
         reach (`/godot/index.pck`, `/replay/*`). Delete both together to reverse.
         See README.md -> Deploying to Vercel. -->
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
