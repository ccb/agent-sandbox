# A small University of Pennsylvania cast for the generative-agents sim, walking
# the REAL campus. The map is derived from OpenStreetMap by
# tools/geo/osm_to_ville.py (the_upenn matrix); each location's `address` is one
# of that matrix's "UPenn:<building>:grounds" sector addresses, and every
# `start_tile` is a walkable doorstep tile the geo tool reported for that
# building. The mock brain drives each persona through its schedule, so this runs
# offline, deterministically, and free -- the same as the_ville cast.
#
# Buildings used (all real, all inside the 34th-36th x Spruce-Walnut block):
#   College Hall, Van Pelt Library, Houston Hall, Williams Hall, Meyerson Hall,
#   Irvine Auditorium. This block is Penn's academic core (College Green) and has
#   no residence in frame, so each persona's `home` is the in-block building they
#   start and spend their day in, and every `start_tile` is the walkable doorstep
#   the geo tool reported for that building (tools/geo/out/upenn_core_ville_addresses.json).

