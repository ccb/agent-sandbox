# A small University of Pennsylvania cast for the generative-agents sim, walking
# the REAL campus. The map is derived from OpenStreetMap by
# tools/geo/osm_to_ville.py (the_upenn matrix). Each building now has a walkable
# interior reached through a single door (tools/geo/add_entrances.py), so each
# location's `address` is the building's "UPenn:<building>:lobby" INTERIOR address
# -- "study in Van Pelt Library" walks the agent in through the door rather than
# stopping at the edge. (The matrix still has "UPenn:<building>:grounds" for the
# outside, and the pathfinder can only cross the wall ring at the door.) Every
# `start_tile` is a walkable doorstep tile just outside its building. The mock
# brain drives each persona through its schedule, so this runs offline,
# deterministically, and free -- the same as the_ville cast.
#
# Buildings used (all real, all inside the 34th-36th x Spruce-Walnut block):
#   College Hall, Van Pelt Library, Houston Hall, Williams Hall, Meyerson Hall,
#   Irvine Auditorium. This block is Penn's academic core (College Green) and has
#   no residence in frame, so each persona starts on the campus walks (`home: Penn
#   campus`, the outdoor hub) at a `start_tile` just outside their first building --
#   so even the first stop is a walk *into* the building through its door, not an
#   activity performed on the doorstep. (The mock brain travels whenever its current
#   location differs from the stop's place; starting at the hub makes stop 1 a real
#   trip inside.)
#
# Van Pelt Library is furnished into 25 navigable rooms (tools/geo/furnish_van_pelt.py
# + add_entrances.py, #268), each its own arena address "UPenn:Van Pelt Library:<room>".
# So instead of stopping in the lobby, the cast below sends its Van Pelt stops to
# specific rooms: a location like "Van Pelt — Moelis Reading Room" carries the address
# "UPenn:Van Pelt Library:Moelis Family Grand Reading Room", and the pathfinder routes
# the agent in through the door and between rooms through the interior doorways. Maya
# walks a real in-library circuit (circulation desk -> reading room in the morning, the
# book stacks -> study booths at night), so the replay shows room-to-room movement
# inside the building rather than an agent frozen at the threshold.
#
# Heads-up when adding rooms: a place name must not contain a bare compass word
# ("north"/"east"/...), because the parser reads "travel to <place>" as a movement
# command and would treat e.g. "West Wing" as "go west". (That is why the west-wing
# stacks are named "Book Stacks" here, not "West Wing Stacks".)

personas:
- name: Maya Chen
  home: Penn campus
  persona: I am Maya Chen, 19, a sophomore at Penn studying biology. I am curious,
    diligent, and a little caffeine-dependent. I spend most of my day studying in
    Van Pelt Library between classes.
  emoji: 📚
  start_tile:
  - 164
  - 57
  schedule:
  # Maya starts on the walk right outside Van Pelt's east door, so her day opens
  # with a walk straight into the library and a circuit through its rooms.
  - place: Van Pelt — Circulation Desk
    activity: checking out a reserved organic chemistry textbook
    emoji: 📚
    steps: 15
  - place: Van Pelt — Moelis Reading Room
    activity: studying for an organic chemistry exam
    emoji: 📚
    steps: 35
  - place: Houston Hall
    activity: grabbing a coffee at the student union
    emoji: ☕
    steps: 100
  - place: College Hall
    activity: heading to an afternoon seminar
    emoji: 🎓
    steps: 50
  - place: Van Pelt — Book Stacks
    activity: pulling a few references off the shelves
    emoji: 📖
    steps: 20
  - place: Van Pelt — Study Booths
    activity: reviewing her notes before tomorrow
    emoji: 📖
- name: Professor Ellis
  home: Penn campus
  persona: I am Professor Ellis, 52. I teach history at Penn and keep an office in
    College Hall. I am thoughtful, a bit formal, and devoted to my students.
  emoji: 🧑‍🏫
  start_tile:
  - 40
  - 265
  schedule:
  - place: Houston Hall
    activity: meeting a student over coffee
    emoji: ☕
    # Ellis lingers at the student union through the morning -- both he and Maya
    # pass through Houston Hall, so with a real brain (and tighter timing) their
    # perception radii can touch here and a conversation can happen.
    steps: 200
  - place: Williams Hall
    activity: giving a midday lecture
    emoji: 🗣️
    steps: 25
  - place: Van Pelt — Microtext Collection
    activity: scanning microfilm of primary sources
    emoji: 📜
    steps: 20
  - place: Van Pelt — Book Stacks
    activity: pulling sources for a paper
    emoji: 📜
    steps: 30
  - place: College Hall
    activity: holding office hours
    emoji: 🧑‍🏫
- name: Diego Torres
  home: Penn campus
  persona: I am Diego Torres, 24, a graduate student in architecture at Penn. I am
    creative, focused, and always sketching. I spend long hours in the Meyerson
    Hall studio.
  emoji: ✏️
  start_tile:
  - 194
  - 48
  schedule:
  - place: Meyerson Hall
    activity: working on a studio model
    emoji: ✏️
    steps: 65
  - place: Van Pelt — Kamin Gallery
    activity: studying precedents in the gallery exhibits
    emoji: 🏛️
    steps: 20
  - place: Van Pelt — Digital Scholarship Exchange
    activity: researching precedents for a project
    emoji: 🏛️
    steps: 25
  - place: Irvine Auditorium
    activity: attending a guest lecture
    emoji: 🎤
    steps: 50
  - place: Meyerson Hall
    activity: refining the model late into the day
    emoji: ✏️

