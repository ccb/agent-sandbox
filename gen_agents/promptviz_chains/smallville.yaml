# Prompt-chain spec for the generative-agents (Smallville) app.
#
# Run the visualizer from the repo root (gen_agents is an installed package):
#
#   python -m text_adventure_games.promptviz.app \
#     --spec gen_agents/promptviz_chains/smallville.yaml
#
# This chain spans BOTH template packages: the gen-agents memory/belief templates
# (`gen_agents.prompt_templates`, the default below) AND the engine cognition a
# Smallville persona reuses once a live LLM is wired in (`text_adventure_games.
# prompt_templates`, set per-node via `templates:`). Nodes whose box is green hold
# agent-generated *memory* text (the mock writes them and never calls a model);
# blue boxes are *real model prompts* that fire only with a live client
# (LLM_PROVIDER set): the daily planner (#83), the decision brain (#168), periodic
# reflection (#84), and dialogue (#86).
name: smallville
description: >-
  A Smallville persona's day with a live LLM: generate a plan (day -> hourly ->
  minute), seed beliefs + plan into memory, then each step perceive, retrieve,
  decide, maybe converse, remember, and periodically reflect. Click a node to read
  its prompt. With the default mock brain the blue prompts aren't sent (the mock
  decides from location alone), but the green memory text is still written.
templates: gen_agents.prompt_templates
_engine: &engine text_adventure_games.prompt_templates

nodes:
  - id: day_start
    label: Day start (t=0)
    kind: start
    description: >-
      Simulation bootstrap (run_simulation.simulate / attach_agents). Beliefs and
      a day plan are prepared before the step loop begins.

  - id: seed_knowledge
    label: Seed spatial knowledge
    kind: narrate
    template: spatial_knowledge
    description: >-
      seed.seed_spatial_knowledge() -- each place a persona knows up front becomes
      a Belief. Memory text (no model call), written before planning so a generative
      planner can reason over it.

  - id: plan_day
    label: "Plan: day outline"
    kind: decision
    template: plan_system
    description: >-
      planner.LLMPlanner._day_outline() -- real model call (#83), only with a live
      client. Sketches the day as a few broad blocks. Shares the plan_system message;
      the day's persona + memory ride in the user message (assembled in code).

  - id: plan_hourly
    label: "Plan: hourly"
    kind: decision
    template: plan_system
    description: >-
      planner.LLMPlanner._hourly() -- expands the day outline into one line per
      in-game hour (bounded to the run's clock window).

  - id: plan_minute
    label: "Plan: minute stops"
    kind: decision
    template: plan_system
    description: >-
      planner.LLMPlanner._minute() -- turns the hourly plan into concrete
      {place, activity} stops, validated against known places. revise() re-runs this
      level on a trigger.

  - id: seed_plan
    label: Seed day plan
    kind: narrate
    template: plan_memory
    description: >-
      smallville_agents.attach_agents() -- the day's PLAN memory (destination +
      whole-day itinerary), seeded at t=0. Memory text (no model call).

  - id: perceive
    label: Perceive
    kind: gate
    description: >-
      memory.ingest_events() -- co-located world events become private
      observations. No model call (the ReAct "Observe" step).

  - id: retrieve
    label: Retrieve memories
    kind: gate
    description: >-
      memory.retrieve() -- scores the memory stream by recency / importance /
      relevance and returns the top-k. No model call.

  - id: decide
    label: Decide (ReAct brain)
    kind: decision
    template: npc_decision
    templates: *engine
    description: >-
      LLMAgent.decide() -- the real decision brain (#168 Phase A): with a live
      client it chooses travel/perform via the engine's npc_decision prompt. The
      default mock ignores this prompt and decides from the current location.
    example_vars:
      persona: I am Isabella Rodriguez. I run Hobbs Cafe and love bringing people together.
      goals_block: "Short-term:\n  - open the cafe and welcome the morning regulars"
      include_instruction: true
      reasoning_label: "Reasoning:"
      action_label: "Action:"
      duration_label: "Duration:"

  - id: dialogue
    label: Converse
    kind: decision
    template: npc_dialogue
    templates: *engine
    description: >-
      conversation.converse() / LLMAgent (#86) -- when two residents are co-located,
      each speaks a line in turn via the engine's npc_dialogue prompt. Real model
      call (live client only).
    example_vars:
      persona: I am Isabella Rodriguez. I run Hobbs Cafe and love bringing people together.
      goals_block: ""

  - id: remember
    label: Remember (reflection)
    kind: narrate
    template: reflection
    description: >-
      smallville_agents.remember_outcome() -- the persona's own action, recorded as
      a first-person observation memory. Memory text (no model call).

  - id: reflect
    label: Reflect (synthesis)
    kind: decision
    template: reflect_system
    templates: *engine
    description: >-
      reflection.reflect() / LLMReflector (#84) -- when accumulated importance
      crosses a threshold, synthesize higher-level insights from recent memories.
      Real model call (live client only); the numbered memory window rides in the
      user message.

edges:
  - { from: day_start, to: seed_knowledge, label: seed beliefs }
  - { from: seed_knowledge, to: plan_day, label: generate the day }
  - { from: plan_day, to: plan_hourly, label: decompose }
  - { from: plan_hourly, to: plan_minute, label: decompose }
  - { from: plan_minute, to: seed_plan, label: seed plan into memory }
  - { from: seed_plan, to: perceive, label: begin step loop }
  - { from: perceive, to: retrieve, label: observe }
  - { from: retrieve, to: decide, label: top-k memories }
  - { from: decide, to: dialogue, label: if co-located }
  - { from: decide, to: remember, label: act, then remember }
  - { from: dialogue, to: remember, label: remember the chat }
  - { from: remember, to: reflect, label: importance crossed threshold }
  - { from: reflect, to: perceive, label: next step }
  - { from: remember, to: perceive, label: next step }
  - {
      from: remember,
      to: plan_minute,
      label: "revise (behind schedule / action failed)",
      condition: replan,
    }
